<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cssMemeSlider</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="wrapper">
      <header class="header">
        <div class="logo">css<span>MemeSlider</span></div>
      </header>
      <main class="main">
        <input type="radio" name="control-button" id="slide-1" checked />
        <input type="radio" name="control-button" id="slide-2" />
        <input type="radio" name="control-button" id="slide-3" />
        <input type="radio" name="control-button" id="slide-4" />
        <div class="css-meme-slider">
          <div class="css-meme-slide slide-1">1</div>
          <div class="css-meme-slide slide-2">2</div>
          <div class="css-meme-slide slide-3">3</div>
          <div class="css-meme-slide slide-4">4</div>
        </div>
        <div class="css-meme-slider_text">
          <div class="css-meme-slide_text slide-1">1</div>
          <div class="css-meme-slide_text slide-2">2</div>
          <div class="css-meme-slide_text slide-3">3</div>
          <div class="css-meme-slide_text slide-4">4</div>
        </div>
        <div class="controls">
          <label class="controls__item" for="slide-1"><span></span></label>
          <label class="controls__item" for="slide-2"><span></span></label>
          <label class="controls__item" for="slide-3"><span></span></label>
          <label class="controls__item" for="slide-4"><span></span></label>
        </div>
      </main>
      <footer class="footer">footer</footer>
    </div>
  </body>
</html>
